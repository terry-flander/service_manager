worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # ── Cloudflare real IP restoration ───────────────────────────────────────
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    upstream flask {
        server flask:5000;
    }

    # ── melbournebikeeducationandhire.com.au — HTTP → HTTPS redirect ─────────
    server {
        listen 80;
        server_name melbournebikeeducationandhire.com.au www.melbournebikeeducationandhire.com.au;
        location / {
            return 301 https://melbournebikeeducationandhire.com.au$request_uri;
        }
    }

    # ── melbournebikeeducationandhire.com.au — HTTPS static site ─────────────
    server {
        listen 443 ssl;
        server_name melbournebikeeducationandhire.com.au www.melbournebikeeducationandhire.com.au;

        ssl_certificate     /etc/nginx/certs/melbournebikeed/origin.pem;
        ssl_certificate_key /etc/nginx/certs/melbournebikeed/origin.key;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;

        if ($host = www.melbournebikeeducationandhire.com.au) {
            return 301 https://melbournebikeeducationandhire.com.au$request_uri;
        }

        root  /var/www/melbournebikeed;
        index index.html;

        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /static/ {
            alias /var/www/melbournebikeed/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        access_log /var/log/nginx/melbournebikeed.access.log main;
        error_log  /var/log/nginx/melbournebikeed.error.log warn;
    }

    # ── app.theflyingbike.com.au — HTTP → HTTPS redirect ─────────────────────
    server {
        listen 80;
        server_name app.theflyingbike.com.au;
        return 301 https://$host$request_uri;
    }

    # ── app.theflyingbike.com.au — HTTPS Flask app ───────────────────────────
    server {
        listen 443 ssl;
        server_name app.theflyingbike.com.au;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;

        client_max_body_size 10M;

        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass         http://flask;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
            proxy_connect_timeout 10s;
            proxy_buffer_size     128k;
            proxy_buffers         4 256k;
        }
    }
}
