worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    upstream flask {
        server flask:5000;
    }

    # ── pistabikes.com.au — HTTP → HTTPS redirect ─────────────────────────────
    server {
        listen 80;
        server_name pistabikes.com.au www.pistabikes.com.au;

        # Allow Let's Encrypt HTTP-01 challenge to work without stopping nginx.
        # Certbot webroot mode: certbot certonly --webroot \
        #   -w /var/www/certbot -d pistabikes.com.au -d www.pistabikes.com.au
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://pistabikes.com.au$request_uri;
        }
    }

    # ── pistabikes.com.au — HTTPS static site ────────────────────────────────
    server {
        listen 443 ssl;
        server_name pistabikes.com.au www.pistabikes.com.au;

        ssl_certificate     /etc/letsencrypt/live/pistabikes.com.au/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pistabikes.com.au/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;

        # www → non-www canonical redirect
        if ($host = www.pistabikes.com.au) {
            return 301 https://pistabikes.com.au$request_uri;
        }

        root  /var/www/pistabikes;
        index index.html;

        # Security headers
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Serve index.html for all requests (single page site)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets aggressively if you add images/css later
        location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        access_log /var/log/nginx/pistabikes.access.log main;
        error_log  /var/log/nginx/pistabikes.error.log warn;
    }

